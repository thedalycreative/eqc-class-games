<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Class Games Hub</title>
		<meta name="viewport" content="width=device-width,initial-scale=1" />

		<style>
			body {
				font-family: system-ui;
				background: #0f172a;
				color: white;
				padding: 40px;
				max-width: 900px;
				margin: auto;
			}

			.grid {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
				gap: 20px;
			}

			.tile {
				background: #020617;
				border-radius: 16px;
				padding: 24px;
				cursor: pointer;
				border: 1px solid rgba(255, 255, 255, 0.1);
				transition: 0.2s;
			}

			.tile:hover {
				transform: translateY(-4px);
			}
		</style>
	</head>

	<body>
		<h1>🎮 Class Game Hub</h1>

		<div class="grid">
			<div
				class="tile"
				onclick="
					window.open(
						'https://www.britannica.com/quiz/guess-the-movie-emoji-quiz',
						'_blank',
					)
				"
			>
				<h3>😀 Emoji Guess Game</h3>
				<p>Guess movies from emojis.</p>
			</div>

			<div class="tile" onclick="location.href = 'prompts.html'">
				<h3>🤖 AI Prompts Playground</h3>
				<p>Funny prompts to copy into AI.</p>
			</div>

			<div class="tile" onclick="location.href = 'truths.html'">
				<h3>🎭 Two Truths & A Lie</h3>
				<p>Build object stories and bluff.</p>
			</div>
		</div>
	</body>
</html>
